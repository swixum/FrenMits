name: Build and deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Dalamud reference assemblies. Your in-game Dalamud is API 15 / net10
      # (staging) -- match it. Switch to .../latest.zip on the release channel.
      - name: Download Dalamud
        shell: pwsh
        run: |
          $dev = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dev | Out-Null
          # The distrib server flakes now and then; retry instead of failing the build.
          $ok = $false
          foreach ($try in 1..5) {
            try {
              Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip" -OutFile dalamud.zip
              $ok = $true; break
            } catch {
              Write-Host "Download attempt $try failed: $($_.Exception.Message)"
              Start-Sleep -Seconds (10 * $try)
            }
          }
          if (-not $ok) { throw "Dalamud download failed after 5 attempts." }
          Expand-Archive -Path dalamud.zip -DestinationPath $dev -Force

      # The offline test suite is kept local and isn't published, so it runs
      # before a commit instead of here (docs/TESTING.md).
      - name: Build
        run: dotnet build src/FrenMits.csproj -c Release --nologo

      # Fren Alerts is a second, separate plugin from this repo. It lives outside
      # src/ on purpose: FrenMits.csproj globs src/**/*.cs, so anything under
      # there would compile into FrenMits.dll instead of its own plugin.
      - name: Build Fren Alerts
        run: dotnet build FrenAlerts/FrenAlerts.csproj -c Release --nologo

      # The neural voice. Built as a check and not published: nothing of Fren Alerts
      # reaches the site any more, and this is the only step that compiles this
      # project, so dropping it would let a break in it go unnoticed.
      - name: Publish the voice pack
        run: dotnet publish FrenAlerts/FrenAlerts.Voice/FrenAlerts.Voice.csproj -c Release -o voicepack --nologo

      # Public Pages site: the plugin zip + the custom-repo manifest.
      - name: Assemble Pages site
        shell: pwsh
        run: |
          $out = "src\bin\x64\Release"
          if (-not (Test-Path "$out\FrenMits.dll")) { $out = "src\bin\Release" }
          New-Item -ItemType Directory -Force -Path "site" | Out-Null
          # Plugin + manifest + icon + bundled NAudio assemblies (online-voice playback)
          # + the baked fight sheets, loaded from Sheets\ beside the DLL.
          if (-not (Test-Path "$out\Sheets\DancingMad(UMAD).json")) { throw "Sheets missing from build output - the zip would ship a plugin with no fights." }
          # Every project reference has to be in the zip by name. This list is
          # not derived from the build, so a new one is invisible until the
          # plugin installs and then refuses to load.
          foreach ($dep in @("FrenMits.Encounters.dll")) {
            if (-not (Test-Path "$out\$dep")) { throw "$dep missing - the plugin would install and then fail to load." }
          }
          $files = @("$out\FrenMits.dll", "$out\FrenMits.Encounters.dll", "$out\FrenMits.json", "$out\icon.png", "$out\NOTICE.md", "$out\Sheets")
          # A wildcard that matches nothing is silent, and the plugin then loads
          # fine and throws at the first spoken call instead.
          $naudio = @(Get-ChildItem "$out\NAudio*.dll")
          if ($naudio.Count -eq 0) { throw "NAudio missing - the online voices would fail at the first call." }
          $files += ($naudio | ForEach-Object { $_.FullName })
          Compress-Archive -Path $files -DestinationPath "site\FrenMits.zip" -Force
          # Publicly host the icon for the listing IconUrl.
          Copy-Item "images\icon.png" "site\icon.png" -Force
          # Fren Alerts is not published. It is still built above, so a change that
          # breaks it still fails this workflow, but nothing of it reaches the site:
          # no zip, no icon, no voice pack, and no entry in the manifest below.
          # Unlisting alone would not have been enough, because the download link
          # stays fetchable by anybody who reads the manifest.
          #
          # Whoever wants it runs it from their own build as a Dalamud dev plugin.
          # Publish the manifest with each version stamped straight from that
          # plugin's own built output, so the in-game installer always sees the
          # version it just got (a committed version can never go stale and block
          # updates). Kept in docs, published at the site root: the URL people
          # pasted into their installer is the published one, and it does not move.
          if (-not (Test-Path "docs\repo.json")) { throw "docs\repo.json missing - every installed plugin would stop seeing updates." }
          $entries = Get-Content "docs\repo.json" -Raw | ConvertFrom-Json
          # Stamped per entry by InternalName, never by a blanket regex: a replace
          # across the file writes one plugin's version into every listing the
          # moment there is more than one, which silently pins the other plugin.
          $built = @{ "FrenMits" = "$out\FrenMits.json" }
          foreach ($e in $entries) {
            $manifest = $built[$e.InternalName]
            if (-not $manifest) { throw "repo.json lists $($e.InternalName) but nothing here built it - its download link would 404." }
            $ver = (Get-Content $manifest -Raw | ConvertFrom-Json).AssemblyVersion
            $e.AssemblyVersion = $ver
            if ($e.PSObject.Properties.Name -contains "TestingAssemblyVersion") { $e.TestingAssemblyVersion = $ver }
            Write-Host "Published $($e.InternalName) at $ver"
          }
          # ConvertTo-Json unwraps a one-element array into a bare object, and a
          # manifest that is not an array lists nothing at all.
          $json = $entries | ConvertTo-Json -Depth 10
          if (@($entries).Count -eq 1) { $json = "[$json]" }
          $json | Set-Content "site\repo.json" -Encoding utf8

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
