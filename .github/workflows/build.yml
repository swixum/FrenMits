name: Build and deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Dalamud reference assemblies. Your in-game Dalamud is API 15 / net10
      # (staging) -- match it. Switch to .../latest.zip on the release channel.
      - name: Download Dalamud
        shell: pwsh
        run: |
          $dev = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dev | Out-Null
          # The distrib server flakes now and then; retry instead of failing the build.
          $ok = $false
          foreach ($try in 1..5) {
            try {
              Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip" -OutFile dalamud.zip
              $ok = $true; break
            } catch {
              Write-Host "Download attempt $try failed: $($_.Exception.Message)"
              Start-Sleep -Seconds (10 * $try)
            }
          }
          if (-not $ok) { throw "Dalamud download failed after 5 attempts." }
          Expand-Archive -Path dalamud.zip -DestinationPath $dev -Force

      # The offline test suite is kept local and isn't published, so it runs
      # before a commit instead of here (docs/TESTING.md).
      - name: Build
        run: dotnet build src/FrenMits.csproj -c Release --nologo

      # Fren Alerts is a second, separate plugin from this repo. It lives outside
      # src/ on purpose: FrenMits.csproj globs src/**/*.cs, so anything under
      # there would compile into FrenMits.dll instead of its own plugin.
      - name: Build Fren Alerts
        run: dotnet build FrenAlerts/FrenAlerts.csproj -c Release --nologo

      # The neural voice, published on its own because it cannot go in the plugin
      # zip: 84MB of native runtime, most of it a phoneme dictionary. It is also a
      # separate PROCESS, which is the point -- native code fails by taking its
      # process down, and that must not be the game's. Whoever wants it fetches it
      # once; everyone else uses the system voice and downloads nothing.
      - name: Publish the voice pack
        run: dotnet publish FrenAlerts/FrenAlerts.Voice/FrenAlerts.Voice.csproj -c Release -o voicepack --nologo

      # Public Pages site: the plugin zip + the custom-repo manifest.
      - name: Assemble Pages site
        shell: pwsh
        run: |
          $out = "src\bin\x64\Release"
          if (-not (Test-Path "$out\FrenMits.dll")) { $out = "src\bin\Release" }
          New-Item -ItemType Directory -Force -Path "site" | Out-Null
          # Plugin + manifest + icon + bundled NAudio assemblies (online-voice playback)
          # + the baked fight sheets, loaded from Sheets\ beside the DLL.
          if (-not (Test-Path "$out\Sheets\DancingMad(UMAD).json")) { throw "Sheets missing from build output - the zip would ship a plugin with no fights." }
          # Every project reference has to be in the zip by name. This list is
          # not derived from the build, so a new one is invisible until the
          # plugin installs and then refuses to load.
          foreach ($dep in @("FrenMits.Encounters.dll")) {
            if (-not (Test-Path "$out\$dep")) { throw "$dep missing - the plugin would install and then fail to load." }
          }
          $files = @("$out\FrenMits.dll", "$out\FrenMits.Encounters.dll", "$out\FrenMits.json", "$out\icon.png", "$out\NOTICE.md", "$out\Sheets")
          # A wildcard that matches nothing is silent, and the plugin then loads
          # fine and throws at the first spoken call instead.
          $naudio = @(Get-ChildItem "$out\NAudio*.dll")
          if ($naudio.Count -eq 0) { throw "NAudio missing - the online voices would fail at the first call." }
          $files += ($naudio | ForEach-Object { $_.FullName })
          Compress-Archive -Path $files -DestinationPath "site\FrenMits.zip" -Force
          # Publicly host the icon for the listing IconUrl.
          Copy-Item "images\icon.png" "site\icon.png" -Force
          # Fren Alerts: its own zip beside FrenMits', from its own project and its
          # own version. Both have to land in this one site folder, because the
          # Pages artifact replaces the whole site and a missing zip is a dead
          # download link for everyone who already installed that plugin.
          $alertsOut = "FrenAlerts\bin\x64\Release"
          if (-not (Test-Path "$alertsOut\FrenAlerts.dll")) { $alertsOut = "FrenAlerts\bin\Release" }
          foreach ($dep in @("FrenAlerts.Engine.dll")) {
            if (-not (Test-Path "$alertsOut\$dep")) { throw "$dep missing - Fren Alerts would install and then fail to load." }
          }
          if (-not (Test-Path "$alertsOut\icon.png")) { throw "Fren Alerts icon missing - the listing would show a blank tile." }
          # Without the call pack the plugin installs, loads, and then says nothing
          # in any fight, which looks like a broken install rather than a missing file.
          if (-not (Test-Path "$alertsOut\calls.facall")) { throw "calls.facall missing - Fren Alerts would have no calls in any fight." }
          # Same again for the timelines: without them nothing counts down and the
          # fight page reads zero mechanics everywhere, with no error to explain it.
          if (-not (Test-Path "$alertsOut\timelines.fatime")) { throw "timelines.fatime missing - no fight would count down." }
          # The fights themselves, and the interpreter that runs them. Either one
          # missing is a plugin that loads and then knows no fight at all, which is
          # exactly the failure the two guards above were written for.
          if (-not (Test-Path "$alertsOut\Jint.dll")) { throw "Jint.dll missing - no fight script could run." }
          if (-not (Test-Path "$alertsOut\Acornima.dll")) { throw "Acornima.dll missing - the script interpreter would not load." }
          $fightScripts = Get-ChildItem "$alertsOut\scripts\*.js" -ErrorAction SilentlyContinue
          if ($fightScripts.Count -lt 10) { throw "only $($fightScripts.Count) fight scripts found - the fights would be missing." }
          Compress-Archive -Path @("$alertsOut\FrenAlerts.dll", "$alertsOut\FrenAlerts.Engine.dll", "$alertsOut\Jint.dll", "$alertsOut\Acornima.dll", "$alertsOut\FrenAlerts.json", "$alertsOut\icon.png", "$alertsOut\calls.facall", "$alertsOut\timelines.fatime", "$alertsOut\scripts", "$alertsOut\timelines", "$alertsOut\names", "$alertsOut\patches") -DestinationPath "site\FrenAlerts.zip" -Force
          # Its own name at the site root, or it would overwrite FrenMits' icon.
          Copy-Item "FrenAlerts\images\icon.png" "site\frenalerts-icon.png" -Force
          # The voice pack, beside the plugin zips rather than inside one. Checked by
          # name and by size: a publish that quietly drops the native runtime leaves
          # an exe that starts, fails to load and looks like a corrupt download.
          if (-not (Test-Path "voicepack\FrenAlertsVoice.exe")) { throw "voice pack missing its executable." }
          foreach ($native in @("onnxruntime.dll", "MisakiSharp.dll", "KokoroSharp.dll")) {
            if (-not (Test-Path "voicepack\$native")) { throw "voice pack missing $native - it would install and never speak." }
          }
          $packSize = (Get-ChildItem "voicepack" -Recurse | Measure-Object -Property Length -Sum).Sum
          if ($packSize -lt 60MB) { throw "voice pack is only $([math]::Round($packSize/1MB))MB - the native runtime did not publish." }
          Compress-Archive -Path "voicepack\*" -DestinationPath "site\FrenAlertsVoice.zip" -Force
          Write-Host "Voice pack published at $([math]::Round($packSize/1MB))MB"
          # Publish the manifest with each version stamped straight from that
          # plugin's own built output, so the in-game installer always sees the
          # version it just got (a committed version can never go stale and block
          # updates). Kept in docs, published at the site root: the URL people
          # pasted into their installer is the published one, and it does not move.
          if (-not (Test-Path "docs\repo.json")) { throw "docs\repo.json missing - every installed plugin would stop seeing updates." }
          $entries = Get-Content "docs\repo.json" -Raw | ConvertFrom-Json
          # Stamped per entry by InternalName, never by a blanket regex: a replace
          # across the file writes one plugin's version into every listing the
          # moment there is more than one, which silently pins the other plugin.
          $built = @{ "FrenMits" = "$out\FrenMits.json"; "FrenAlerts" = "$alertsOut\FrenAlerts.json" }
          foreach ($e in $entries) {
            $manifest = $built[$e.InternalName]
            if (-not $manifest) { throw "repo.json lists $($e.InternalName) but nothing here built it - its download link would 404." }
            $ver = (Get-Content $manifest -Raw | ConvertFrom-Json).AssemblyVersion
            $e.AssemblyVersion = $ver
            if ($e.PSObject.Properties.Name -contains "TestingAssemblyVersion") { $e.TestingAssemblyVersion = $ver }
            Write-Host "Published $($e.InternalName) at $ver"
          }
          # ConvertTo-Json unwraps a one-element array into a bare object, and a
          # manifest that is not an array lists nothing at all.
          $json = $entries | ConvertTo-Json -Depth 10
          if (@($entries).Count -eq 1) { $json = "[$json]" }
          $json | Set-Content "site\repo.json" -Encoding utf8

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
