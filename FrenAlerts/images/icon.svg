<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2030"/><stop offset="1" stop-color="#10141d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f89f5"/><stop offset="1" stop-color="#4166d8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fd47c"/><stop offset="1" stop-color="#48ad57"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f57166"/><stop offset="1" stop-color="#dc4a3f"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb443" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffb443" stop-opacity="0"/>
    </radialGradient>

    <!-- The body: 150 wide, dead centre on its own origin. -->
    <g id="fren">
      <path d="M0,-95 a75,75 0 0 1 75,75 v75 a20,20 0 0 1 -20,20 h-110 a20,20 0 0 1 -20,-20
               v-75 a75,75 0 0 1 75,-75 z"/>
    </g>
    <g id="face">
      <ellipse cx="-26" cy="-18" rx="10" ry="13" fill="#161b2b"/>
      <ellipse cx="26" cy="-18" rx="10" ry="13" fill="#161b2b"/>
      <path d="M-24,18 q24,22 48,0" fill="none" stroke="#161b2b" stroke-width="9"
            stroke-linecap="round"/>
    </g>
    <g id="faceWide">
      <ellipse cx="-26" cy="-20" rx="12" ry="16" fill="#161b2b"/>
      <ellipse cx="26" cy="-20" rx="12" ry="16" fill="#161b2b"/>
      <ellipse cx="0" cy="24" rx="13" ry="16" fill="#161b2b"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#plate)"/>
  <circle cx="256" cy="330" r="180" fill="url(#glowAmber)"/>

  <!-- the puddle they are standing in -->
  <ellipse cx="256" cy="392" rx="180" ry="52" fill="#f0a52e" fill-opacity=".18"/>
  <ellipse cx="256" cy="392" rx="180" ry="52" fill="none" stroke="#ffb443" stroke-width="11"/>
  <ellipse cx="256" cy="392" rx="112" ry="32" fill="none" stroke="#ffb443" stroke-width="7"
           stroke-opacity=".6"/>

  <!-- Outer two mirror each other about 256: 256 - 88 and 256 + 88.
       All three stand on one line: y + 75*scale = 412 for each. -->
  <g transform="translate(168,352) scale(.8)">
    <use href="#fren" fill="url(#blue)"/><use href="#face"/>
  </g>
  <g transform="translate(344,352) scale(.8)">
    <use href="#fren" fill="url(#red)"/><use href="#face"/>
  </g>
  <g transform="translate(256,343) scale(.92)">
    <use href="#fren" fill="url(#green)"/><use href="#faceWide"/>
  </g>

  <!-- what is about to land -->
  <g transform="translate(256,120)">
    <path d="M0,-72 l82,142 h-164 z" fill="#ffb443"/>
    <!-- The mark sits high in the triangle: the dot used to reach y=72, two past
         the base at 70, so it read as sliding out of the bottom. -->
    <rect x="-13" y="-36" width="26" height="62" rx="13" fill="#2a1c06"/>
    <circle cx="0" cy="46" r="13" fill="#2a1c06"/>
  </g>
</svg>
